components:
  schemas:
    AIInsightReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        model:
          type: string
          maxLength: 80
        period_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        summary:
          type: string
        priorities: {}
        opportunities: {}
        risks: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - source
      - summary
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 60
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        country_code:
          type: string
          maxLength: 2
        city:
          type: string
          maxLength: 80
        region:
          type: string
          maxLength: 80
        postal_code:
          type: string
          maxLength: 20
        line1:
          type: string
          maxLength: 220
        line2:
          type: string
          maxLength: 220
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - full_name
      - id
      - line1
      - phone
      - updated_at
    AlertTypeEnum:
      enum:
      - out_of_stock
      - low_stock
      - expiring
      - expired
      - slow_moving
      type: string
      description: |-
        * `out_of_stock` - نفاد المخزون
        * `low_stock` - مخزون منخفض
        * `expiring` - قرب انتهاء الصلاحية
        * `expired` - منتهي الصلاحية
        * `slow_moving` - بطيء الحركة
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        subtotal_cents:
          type: integer
          readOnly: true
        discount_cents:
          type: integer
          readOnly: true
        tax_cents:
          type: integer
          readOnly: true
        shipping_cents:
          type: integer
          readOnly: true
        total_cents:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        coupon_code:
          type: string
          maxLength: 40
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - currency
      - discount_cents
      - id
      - item_count
      - items
      - shipping_cents
      - subtotal_cents
      - tax_cents
      - total_cents
      - updated_at
    CartCoupon:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
      required:
      - code
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/ProductVariant'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        line_total_cents:
          type: integer
          readOnly: true
      required:
      - id
      - line_total_cents
      - product
      - variant
    CartItemWrite:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          maximum: 99
          minimum: 1
        variant_id:
          type: integer
          nullable: true
      required:
      - product_id
      - quantity
    CartQuantity:
      type: object
      properties:
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
      - quantity
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 220
        description_en:
          type: string
          maxLength: 220
        image_url:
          type: string
          format: uri
          maxLength: 500
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
      - slug
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        product_id:
          type: integer
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - product_id
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required:
      - service
      - status
    InventoryAIRequest:
      type: object
      properties:
        days:
          type: integer
          maximum: 365
          minimum: 7
          default: 30
        focus:
          type: string
          maxLength: 500
    InventoryAIResponse:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        ai_status:
          type: string
        summary:
          type: string
        priorities:
          type: array
          items:
            type: object
            additionalProperties: {}
        opportunities:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
      required:
      - ai_status
      - id
      - opportunities
      - priorities
      - risks
      - source
      - summary
    InventoryAdjustment:
      type: object
      properties:
        product:
          type: integer
        variant:
          type: integer
          nullable: true
        quantity_delta:
          type: integer
        kind:
          allOf:
          - $ref: '#/components/schemas/InventoryAdjustmentKindEnum'
          default: adjustment
        reason:
          type: string
          maxLength: 300
        lot_number:
          type: string
          maxLength: 100
        expires_at:
          type: string
          format: date
          nullable: true
        unit_cost_cents:
          type: integer
          minimum: 0
          default: 0
      required:
      - product
      - quantity_delta
    InventoryAdjustmentKindEnum:
      enum:
      - restock
      - adjustment
      - return
      - expired
      type: string
      description: |-
        * `restock` - restock
        * `adjustment` - adjustment
        * `return` - return
        * `expired` - expired
    InventoryAlert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        product:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        variant:
          type: integer
          readOnly: true
          nullable: true
        variant_name:
          type: string
          readOnly: true
          nullable: true
        batch:
          type: integer
          readOnly: true
          nullable: true
        message:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acknowledged_at
      - alert_type
      - batch
      - created_at
      - id
      - is_active
      - last_seen_at
      - message
      - product
      - product_name
      - severity
      - variant
      - variant_name
    InventoryBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        variant:
          type: integer
          nullable: true
        variant_name:
          type: string
          readOnly: true
          nullable: true
        lot_number:
          type: string
          maxLength: 100
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_cost_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
