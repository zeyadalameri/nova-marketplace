services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-before-production}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:-nova-local-password}@postgres:5432/${POSTGRES_DB:-nova}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      PUBLIC_STORE_URL: ${PUBLIC_STORE_URL:-http://localhost:3000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-replace-payment-secret}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-sandbox}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-me-south-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-NOVA <no-reply@nova.local>}
      BASE_CURRENCY: ${BASE_CURRENCY:-SAR}
      TAX_RATE_BPS: ${TAX_RATE_BPS:-1500}
      DEFAULT_SHIPPING_CENTS: ${DEFAULT_SHIPPING_CENTS:-1500}
      FREE_SHIPPING_THRESHOLD_CENTS: ${FREE_SHIPPING_THRESHOLD_CENTS:-30000}
      API_ANON_RATE: ${API_ANON_RATE:-120/min}
      API_USER_RATE: ${API_USER_RATE:-600/min}
      INVENTORY_EXPIRY_WARNING_DAYS: ${INVENTORY_EXPIRY_WARNING_DAYS:-30}
      INVENTORY_SLOW_MOVING_DAYS: ${INVENTORY_SLOW_MOVING_DAYS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INVENTORY_MODEL: ${OPENAI_INVENTORY_MODEL:-gpt-5.6-terra}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5

  inventory_monitor:
    build: ./apps/backend
    restart: unless-stopped
    command: ["python", "manage.py", "monitor_inventory", "--watch", "--interval", "300"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-before-production}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:-nova-local-password}@postgres:5432/${POSTGRES_DB:-nova}
      PUBLIC_STORE_URL: ${PUBLIC_STORE_URL:-http://localhost:3000}
      INVENTORY_EXPIRY_WARNING_DAYS: ${INVENTORY_EXPIRY_WARNING_DAYS:-30}
      INVENTORY_SLOW_MOVING_DAYS: ${INVENTORY_SLOW_MOVING_DAYS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INVENTORY_MODEL: ${OPENAI_INVENTORY_MODEL:-gpt-5.6-terra}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-NOVA <no-reply@nova.local>}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
